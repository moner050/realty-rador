<div id="search-results" class="rounded-xl border border-amber-500/40 bg-amber-500/10 p-5 text-amber-100" role="alert">
    {% if search_error_reason == 'purchase_profile_incomplete' %}
    <p class="font-semibold">실구매 가능 조건을 먼저 설정해 주세요.</p>
    <p class="mt-1 text-sm text-amber-100/80">구매 투입 가능 현금과 월 총주거비를 먼저 설정한 뒤 다시 검색하세요.</p>
    <a href="#inline-profile-form" class="mt-3 inline-flex rounded-lg border border-amber-300/50 px-3 py-1.5 text-sm font-medium hover:bg-amber-500/10">개인 조건 설정</a>
    {% else %}
    <p class="font-semibold">검색 조건을 확인해 주세요.</p>
    <p class="mt-1 text-sm text-amber-100/80">정렬, 단지명, 또는 페이지 cursor가 올바르지 않습니다.</p>
    <a href="/" class="mt-3 inline-flex rounded-lg border border-amber-300/50 px-3 py-1.5 text-sm font-medium hover:bg-amber-500/10">전체 초기화</a>
    {% endif %}
</div>
