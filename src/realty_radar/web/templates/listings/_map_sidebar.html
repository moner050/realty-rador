<section data-listing-map-root data-map-data-url="{{ map_data_url }}" data-map-cards-url="{{ map_cards_url }}" data-map-complex-url-template="{{ map_complex_url_template | default('') }}" class="relative min-h-[360px] w-full overflow-hidden rounded-2xl border border-slate-300 bg-slate-100 shadow-xl dark:border-slate-800 dark:bg-slate-900">
    <div class="flex items-center justify-between gap-3 border-b border-slate-200 bg-white p-3 text-xs font-bold dark:border-slate-800 dark:bg-slate-950">
        <span class="flex items-center gap-2 text-slate-900 dark:text-white">매물 위치 지도 <span data-map-loading hidden class="hidden text-[11px] text-indigo-600 dark:text-indigo-300">지도 갱신 중</span></span>
        <span class="rounded-full bg-indigo-50 px-2 py-0.5 text-[11px] font-extrabold text-indigo-600 dark:bg-indigo-950 dark:text-indigo-400">
            <span data-map-matching-count>0</span>개 단지 · <span data-map-mapped-count>0</span>개 지도 표시 · <span data-map-unmapped-count>0</span>개 좌표 미확인
        </span>
    </div>
    <div class="relative">
        <div data-listings-map class="h-[56vh] min-h-[360px] max-h-[680px] w-full"></div>
        <div data-map-summary hidden class="hidden pointer-events-none absolute inset-x-4 top-4 rounded-xl border border-indigo-200 bg-white/95 px-4 py-3 text-center text-sm font-bold text-slate-800 shadow-lg dark:border-indigo-800 dark:bg-slate-950/95 dark:text-slate-100">
            이 영역의 조건 충족 매물 <span data-map-summary-count class="text-lg text-indigo-700 dark:text-indigo-300">0</span>건
        </div>
    </div>
    <p data-listing-map-status class="px-4 py-3 text-xs font-medium text-slate-500 dark:text-slate-400"></p>
    <dialog data-map-complex-modal class="theme-surface w-[min(52rem,calc(100vw-2rem))] rounded-2xl border border-slate-300 bg-white p-0 text-slate-900 shadow-2xl backdrop:bg-slate-950/60 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
        <div class="max-h-[85vh] overflow-y-auto p-5 sm:p-6">
            <div class="flex items-start justify-between gap-4">
                <div>
                    <p class="text-xs font-bold text-indigo-700 dark:text-indigo-300">단지 조건 충족 매물</p>
                    <h2 data-map-complex-title class="mt-1 text-xl font-extrabold"></h2>
                    <p data-map-complex-address class="mt-1 text-sm font-semibold text-slate-600 dark:text-slate-400"></p>
                    <p data-map-complex-price class="mt-2 text-sm font-extrabold text-indigo-700 dark:text-indigo-300"></p>
                </div>
                <button type="button" data-map-complex-close class="rounded-lg p-2 text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white" aria-label="단지 매물 모달 닫기">×</button>
            </div>
            <div data-map-complex-listings class="mt-5 space-y-3 border-t border-slate-200 pt-5 dark:border-slate-800"></div>
        </div>
    </dialog>
</section>
