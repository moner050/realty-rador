{% extends "base.html" %}

{% block title %}SITE_A 매물 검색{% endblock %}

{% block content %}
<div class="space-y-6">
    <div>
        <h1 class="text-2xl font-bold text-white">SITE_A 매물 검색</h1>
        <p class="mt-1 text-sm text-slate-400">전체 건수와 페이지 번호 대신 빠른 cursor 조회를 사용합니다.</p>
    </div>

    <form class="grid grid-cols-1 gap-3 rounded-xl border border-slate-700 bg-slate-800 p-4 md:grid-cols-4"
          action="/listings/search" method="get" hx-get="/listings/search" hx-target="#listings-container" hx-push-url="true">
        <input name="sigungu_code" value="{{ filters.sigungu_code or '' }}" placeholder="시군구 코드 (예: 11500)"
               class="rounded bg-slate-900 px-3 py-2 text-sm text-white">
        <input name="complex_keyword" value="{{ filters.complex_keyword or '' }}" placeholder="단지명 (2글자 이상)"
               class="rounded bg-slate-900 px-3 py-2 text-sm text-white">
        <input name="max_price" value="{{ filters.max_price or '' }}" placeholder="최대 가격(원)"
               class="rounded bg-slate-900 px-3 py-2 text-sm text-white">
        <select name="sort_by" class="rounded bg-slate-900 px-3 py-2 text-sm text-white">
            {% for value, label in [('price_asc','가격 낮은순'), ('price_desc','가격 높은순'), ('recent','최신순'), ('area_desc','면적 넓은순'), ('households_desc','세대수 많은순')] %}
            <option value="{{ value }}" {% if filters.sort_by == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
        <label class="text-sm text-slate-300"><input type="checkbox" name="group_by_complex" value="true" {% if filters.group_by_complex %}checked{% endif %}> 단지로 묶기</label>
        <label class="text-sm text-slate-300"><input type="checkbox" name="exclude_short_term" value="true" {% if filters.exclude_short_term %}checked{% endif %}> 단기임대 제외</label>
        <input type="hidden" name="page_size" value="{{ filters.page_size }}">
        <button class="rounded bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">검색</button>
    </form>

    <div id="listings-container">
        {% include "listings/list_partial.html" %}
    </div>
</div>
{% endblock %}
