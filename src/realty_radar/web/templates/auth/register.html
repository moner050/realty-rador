{% extends "base.html" %}

{% block title %}간소화 회원가입{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="theme-surface max-w-md w-full space-y-8 bg-white dark:bg-slate-900/90 border border-slate-200 dark:border-slate-800 p-8 rounded-2xl shadow-2xl backdrop-blur-md text-slate-900 dark:text-slate-100 transition-colors">
        <div>
            <div class="w-12 h-12 rounded-xl bg-indigo-600/20 border border-indigo-500/30 text-indigo-600 dark:text-indigo-400 flex items-center justify-center mx-auto text-2xl">
                ✨
            </div>
            <h2 class="mt-4 text-center text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">
                간편 회원가입
            </h2>
            <p class="mt-2 text-center text-xs text-slate-500 dark:text-slate-400">
                구글 계정 또는 아이디 입력으로 3초 만에 회원가입 완료!
            </p>
        </div>

        {% if error %}
        <div class="rounded-xl bg-red-500/10 border border-red-500/30 p-3.5 text-xs text-red-600 dark:text-red-300 flex items-center gap-2 font-medium">
            <svg class="w-4 h-4 shrink-0 text-red-500 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- 🌐 구글 간편 회원가입 버튼 -->
        <div>
            <a href="/auth/google/login"
               class="w-full py-3 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-white dark:hover:bg-slate-100 text-slate-900 font-bold text-sm shadow-md transition-all flex items-center justify-center space-x-2 border border-slate-300 dark:border-slate-200">
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Google 계정으로 3초 만에 시작하기</span>
            </a>
        </div>

        <div class="relative flex py-1 items-center">
            <div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
            <span class="flex-shrink mx-4 text-slate-500 text-xs font-semibold">또는 직접 입력 가입</span>
            <div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
        </div>

        <form class="mt-4 space-y-4" action="/register" method="POST">
            <div class="space-y-4">
                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        사용할 아이디
                    </label>
                    <input id="username" name="username" type="text" required placeholder="아이디 입력 (영문, 숫자 3자 이상)"
                           class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        비밀번호
                    </label>
                    <input id="password" name="password" type="password" required placeholder="비밀번호 입력 (4자 이상)"
                           class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                </div>

                <div>
                    <label for="password_confirm" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        비밀번호 확인
                    </label>
                    <input id="password_confirm" name="password_confirm" type="password" required placeholder="비밀번호 재입력"
                           class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                </div>
            </div>

            <div>
                <button type="submit"
                        class="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-lg shadow-indigo-600/30 transition-all">
                    회원가입 & 시작하기 🚀
                </button>
            </div>
        </form>

        <div class="text-center pt-2 border-t border-slate-200 dark:border-slate-800/60">
            <p class="text-xs text-slate-500 dark:text-slate-400">
                이미 계정이 있으신가요?
                <a href="/login" class="font-bold text-indigo-600 dark:text-indigo-400 hover:underline ml-1">로그인하기 ↗</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
