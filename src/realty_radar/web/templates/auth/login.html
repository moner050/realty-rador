{% extends "base.html" %}

{% block title %}관리자 로그인 - Realty Radar{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-slate-800/80 border border-slate-700/80 p-8 rounded-2xl shadow-2xl backdrop-blur-xl">
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 mb-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
            </div>
            <h2 class="text-2xl font-extrabold text-white tracking-tight">
                관리자 인증 로그인
            </h2>
            <p class="text-xs text-slate-400">
                수집 현황 및 시스템 설정을 관리하려면 로그인이 필요합니다.
            </p>
        </div>

        {% if error %}
        <div class="p-3.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-semibold text-center flex items-center justify-center space-x-2">
            <svg class="w-4 h-4 text-red-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form class="mt-8 space-y-5" action="/login" method="POST">
            <div class="space-y-4">
                <div>
                    <label for="username" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">
                        관리자 아이디
                    </label>
                    <input id="username" 
                           name="username" 
                           type="text" 
                           required 
                           value="admin"
                           placeholder="아이디를 입력하세요" 
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                </div>

                <div>
                    <label for="password" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">
                        비밀번호
                    </label>
                    <input id="password" 
                           name="password" 
                           type="password" 
                           required 
                           placeholder="비밀번호를 입력하세요" 
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                </div>
            </div>

            <div>
                <button type="submit" 
                        class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center space-x-2">
                    <span>로그인하기</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </button>
            </div>
        </form>

        <div class="text-center pt-2">
            <span class="text-[11px] text-slate-500">
                기본 아이디: <code class="text-slate-400 font-mono">admin</code> / 기본 비밀번호: <code class="text-slate-400 font-mono">admin1234</code> (.env 설정)
            </span>
        </div>
    </div>
</div>
{% endblock %}
