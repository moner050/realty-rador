<!DOCTYPE html>
<html lang="ko" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="개인용 부동산 매물 크롤링 및 다중 필터링 플랫폼 Realty Radar">
    <title>{% block title %}Realty Radar - 부동산 통합 검색{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        /* 새로고침 시 Tailwind 스크립트 로딩 전 FOUC(CSS 순간 깨짐) 방지 사전 로딩 스타일 */
        html, body {
            background-color: #0f172a !important;
            color: #f1f5f9 !important;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex flex-col min-h-full font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- 글로벌 네비게이션 바 -->
    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="/" class="flex items-center space-x-2 text-indigo-400 font-bold text-xl tracking-tight">
                    <svg class="w-7 h-7 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0V11m0 0h4m-4 0H9m4 0V7m0 0h4m-4 0H9"/>
                    </svg>
                    <span>Realty Radar</span>
                </a>
                <span class="text-xs px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-medium">Local v0.1</span>
            </div>

            <nav class="flex items-center space-x-6">
                <a href="/" class="text-sm font-medium text-slate-200 hover:text-indigo-400 transition-colors">매물 검색</a>
                {% if is_authenticated %}
                <a href="/jobs" class="text-sm font-medium text-slate-400 hover:text-indigo-400 transition-colors">수집 현황</a>
                <a href="/settings" class="text-sm font-medium text-slate-400 hover:text-indigo-400 transition-colors">설정</a>
                <a href="/logout" class="text-xs px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-red-600/80 text-slate-300 hover:text-white border border-slate-700 transition-all font-medium">로그아웃</a>
                {% else %}
                <a href="/login" class="text-xs px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold shadow-md shadow-indigo-600/20 transition-all flex items-center space-x-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                    </svg>
                    <span>로그인</span>
                </a>
                {% endif %}
            </nav>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- 푸터 -->
    <footer class="border-t border-slate-800 bg-slate-950/50 py-6 text-center text-xs text-slate-500">
        <p>© 2026 Realty Radar. Personal Real Estate Search & Aggregator System.</p>
    </footer>

</body>
</html>
