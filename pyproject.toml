[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "realty-radar"
version = "0.1.0"
description = "개인용 부동산 매물 크롤링·필터링 시스템"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "jinja2>=3.1.3",
    "sqlalchemy>=2.0.28",
    "pymysql>=1.1.0",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "playwright>=1.42.0",
    "httpx>=0.27.0",
    "selectolax>=0.3.20",
    "tenacity>=8.2.3",
    "rapidfuzz>=3.6.2",
    "apscheduler>=3.10.4",
    "structlog>=24.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.3",
    "mypy>=1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/realty_radar"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: external SITE_A verification; requires RUN_LIVE_SITE_A_HTTPX=1",
    "mysql: MySQL 8.4 integration verification; requires MYSQL_V2_TEST_URL",
]
